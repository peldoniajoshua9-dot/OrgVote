<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrgVote</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><h1><img class="logo" src="logo.svg" alt=""> OrgVote</h1><a href="admin.html">Admin Portal</a></header>

<main>
  <div id="sAuth" class="card">
    <h2>Student Login Portal</h2>
    <label>LRN (12 digits)</label>
    <input id="lrn" inputmode="numeric" maxlength="12" placeholder="e.g. 123456789012">
    <label>Password</label>
    <label>Grade level</label>
<select id="sgrade" style="width:100%;padding:10px;margin:6px 0 12px">
  <option value="">Select your grade level</option>
  <option value="7">Grade 7</option>
  <option value="8">Grade 8</option>
  <option value="9">Grade 9</option>
  <option value="10">Grade 10</option>
  <option value="11">Grade 11</option>
  <option value="12">Grade 12</option>
</select>
    <input id="spw" type="password" placeholder="Create or enter your password">
    <p><a href="#" onclick="showReset();return false">Forgot password?</a></p>
    <button class="btn" onclick="studentRegister()">Register (first time)</button>
    <button class="btn alt" onclick="studentLogin()">Log in</button>
    <div id="sMsg"></div>
  </div>
  <div id="sReset" class="card hide">
  <h2>Reset Password</h2>
  <label>LRN (12 digits)</label>
  <input id="rlrn" inputmode="numeric" maxlength="12">
  <label>Recovery code</label>
  <input id="rcode" placeholder="e.g. K7M2-9QXA-4TBN">
  <label>New password</label>
  <input id="rpw" type="password" placeholder="At least 6 characters">
  <button class="btn" onclick="resetPassword()">Reset password</button>
  <button class="btn alt" onclick="hideReset()">Back to login</button>
  <div id="rMsg"></div>
</div>
  <div id="sVote" class="card hide">
    <h2>Candidates &amp; Online Voting</h2>
    <p>Logged in as <b id="who"></b>. <button class="btn alt" onclick="studentLogout()"</button>>Log out</button></p><button class="btn alt" onclick="newRecovery()">New recovery code</button>
    <div id="ballot"></div>
    <div id="vMsg"></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/student.js"></script>
<script src="bg.js" defer></script>
</body>
</html>
